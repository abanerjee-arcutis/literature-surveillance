# Databricks Asset Bundle: the daily surveillance job and the review app. Setup steps: DEPLOY.md.
# Change the values marked EDIT, then run:  databricks bundle deploy
bundle:
  name: lit-surv

variables:
  catalog:
    description: Unity Catalog catalog that holds the schema and tables below
    default: medical_prod                             # EDIT: this workspace has no 'main' catalog
  schema:
    default: apps                                     # Medical Affairs schema for app-backing files
  table_prefix:
    description: Prefix of the tables in tables.sql (<table_prefix>_articles, _runs, _decisions, _settings)
    default: literature_surveillance
  warehouse_id:
    description: SQL warehouse the app reads and saves decisions and settings through
    lookup:
      warehouse: medical-sql-wh-westus2               # EDIT: name of a SQL warehouse (SQL Warehouses in the sidebar)
  notify_email:
    description: Gets an email if a run fails; also sent to NCBI and OpenAlex as the contact address
    default: abanerjee@arcutis.com
  secret_scope:
    description: Secret scope holding pubmed-api-key, serpapi-key and (optional) openalex-api-key
    default: lit-surv

sync:
  exclude:
    - data/**
    - literature_update.html
    - tests/page_offline.html
    - ci_mails/**                                     # run from a laptop: loads the _intents and _ci_articles tables
    - "**/__pycache__/**"

resources:
  jobs:
    lit_surv_daily:
      name: Literature surveillance (daily)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"         # every day at 06:00
        timezone_id: America/Los_Angeles
        pause_status: UNPAUSED
      email_notifications:
        on_failure:
          - ${var.notify_email}
      max_concurrent_runs: 1
      timeout_seconds: 3600
      tasks:
        - task_key: refresh
          environment_key: default                     # serverless compute
          spark_python_task:
            python_file: ./surveillance.py
            parameters:
              - --tables
              - ${var.catalog}.${var.schema}.${var.table_prefix}
              - --email
              - ${var.notify_email}
              - --secret-scope
              - ${var.secret_scope}
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - requests

  apps:
    lit_surv_app:
      name: literature-surveillance                  # must match the app that already exists in the workspace
      description: Literature Update review page
      source_code_path: ./app
      resources:                                       # what the app's service principal may use
        - name: sql-warehouse                          # runs the app's SQL; app.yaml passes its id to the app
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: articles-read                          # the page is built from the articles and the last run
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.table_prefix}_articles
            securable_type: TABLE
            permission: SELECT
        - name: runs-read
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.table_prefix}_runs
            securable_type: TABLE
            permission: SELECT
        - name: decisions-read
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.table_prefix}_decisions
            securable_type: TABLE
            permission: SELECT
        - name: decisions-write
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.table_prefix}_decisions
            securable_type: TABLE
            permission: MODIFY
        - name: settings-read
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.table_prefix}_settings
            securable_type: TABLE
            permission: SELECT
        - name: settings-write
          uc_securable:
            securable_full_name: ${var.catalog}.${var.schema}.${var.table_prefix}_settings
            securable_type: TABLE
            permission: MODIFY

targets:
  prod:
    default: true
    workspace:
      host: https://adb-7405608290672797.17.azuredatabricks.net
